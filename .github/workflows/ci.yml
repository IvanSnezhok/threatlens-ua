name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # Must track the image used by compose.yaml and by the local integration harness.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: threatlens_test
          POSTGRES_PASSWORD: threatlens_test
          POSTGRES_DB: threatlens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U threatlens_test -d threatlens_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # The harness reuses this server instead of starting its own Docker container.
      TEST_DATABASE_URL: postgresql://threatlens_test:threatlens_test@127.0.0.1:5432/threatlens_test
      # Turns "no database" into a hard failure, so a broken service container can never be
      # mistaken for a green run with silently skipped integration tests.
      REQUIRE_INTEGRATION_DB: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (unit and PostgreSQL integration)
        run: npm test

      - name: Build
        run: npm run build

  audit:
    name: production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
