services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-13000}:3000"
      # Codex sign-in returns to http://localhost:1455/auth/callback, which is the only redirect the
      # Codex OAuth client accepts. Loopback on the host only: this port carries an authorisation
      # code, and it is open for the seconds between pressing the button and the browser coming back.
      - "127.0.0.1:${CODEX_OAUTH_REDIRECT_PORT:-1455}:${CODEX_OAUTH_REDIRECT_PORT:-1455}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10
    volumes:
      - ./data/map:/app/data/map:ro

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-threatlens}
      POSTGRES_USER: ${POSTGRES_USER:-threatlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      POSTGRES_ADMIN_URL: postgresql://${POSTGRES_USER:-threatlens}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/postgres
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - ./scripts/restore-test.sh:/usr/local/bin/restore-test.sh:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres18-data:
  caddy-data:
  caddy-config:
