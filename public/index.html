<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0c10">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="ThreatLens UA — перевірені тривоги, загрози та пояснювана аналітика для України.">
  <title>ThreatLens UA — ситуаційна карта</title>

  <!-- Кириличні накреслення тримають увесь хром: навігацію, стрічку стану й підписи шарів.
       Латинське накреслення моноширинного — це цифри годинника й лічильники, тобто перше,
       що змінюється на екрані. Решта підвантажується через font-display: swap. -->
  <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/commissioner-cyrillic.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/jetbrains-mono-cyrillic.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/jetbrains-mono-latin.woff2" crossorigin>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <a class="skip-link" href="#app">Перейти до вмісту</a>

  <header class="masthead">
    <a class="brand" href="/" aria-label="ThreatLens UA, головна">
      <span class="brand-mark" aria-hidden="true">TL</span>
      <span><strong>ThreatLens</strong><small>Україна / оперативна картина</small></span>
    </a>
    <nav class="nav" aria-label="Основна навігація">
      <a href="/" data-route="/">Карта</a>
      <a href="/history" data-route="/history">Хронологія</a>
      <a href="/analytics" data-route="/analytics">Аналітика</a>
      <a href="/sources" data-route="/sources">Джерела</a>
      <a href="/about" data-route="/about">Методологія</a>
    </nav>
    <div class="clock" id="clock"><span>KYIV</span><strong>--:--:--</strong></div>
  </header>

  <div class="system-strip" id="system-strip" role="status">
    <span class="status-dot" aria-hidden="true"></span>
    <strong id="system-state">Підключення…</strong>
    <span id="last-update">очікуємо дані</span>
    <span class="strip-spacer"></span>
    <span id="demo-label" hidden>ДЕМО-РЕЖИМ</span>
  </div>

  <main id="app" tabindex="-1"></main>

  <noscript>
    <div class="noscript-note">
      <strong>Потрібен JavaScript</strong>
      <p>Карта, потік подій і хронологія будуються в браузері. Це не система оповіщення — під час
        офіційної тривоги виконуйте вказівки Повітряних сил, ДСНС і місцевої влади.</p>
    </div>
  </noscript>

  <template id="map-page">
    <section class="situation-layout">
      <div class="map-stage">
        <div id="map" aria-label="Інтерактивна карта України"></div>
        <div class="map-vignette" aria-hidden="true"></div>
        <div class="map-panels">
          <div class="map-tools" aria-label="Шари карти">
            <button class="layer-toggle is-active" data-layer="alerts"><i class="swatch alert"></i>Тривоги</button>
            <button class="layer-toggle is-active" data-layer="threats"><i class="swatch threat"></i>Загрози</button>
            <button class="layer-toggle is-active" data-layer="assessments"><i class="swatch risk"></i>Аналітика</button>
            <button class="layer-toggle is-active" data-layer="occupation" hidden><i class="swatch occupation"></i>Окупація</button>
          </div>
          <div class="sovereignty-badge"><strong>Крим — Україна</strong><span>Міжнародно визнані кордони</span></div>
          <details class="occupation-legend" id="occupation-legend" hidden></details>
        </div>
        <div class="map-caption">
          <span>Заливка — активна офіційна тривога: щільна на території з повідомлення, приглушена — коли тривога лише в частині області. Наблизьте карту, щоб побачити райони; клікніть територію, щоб відкрити історію. Напрямки не є прогнозом траєкторії.</span>
          <button id="fit-ukraine">Показати всю Україну</button>
        </div>
      </div>
      <aside class="event-rail" aria-label="Активні події">
        <div class="rail-head">
          <div><p>Ситуація зараз</p><h1>Активні події</h1></div>
          <span class="event-count" id="event-count">0</span>
        </div>
        <div class="event-list" id="event-list"></div>
        <div class="rail-footer">
          <p>Немає повідомлення ≠ немає загрози</p>
          <a class="telegram-cta" href="https://t.me/" target="_blank" rel="noreferrer">Підписатися в Telegram ↗</a>
        </div>
      </aside>
    </section>
  </template>

  <template id="content-page">
    <section class="content-shell">
      <header class="content-heading"><p id="page-kicker"></p><h1 id="page-title"></h1><p id="page-deck"></p></header>
      <div id="page-content"></div>
    </section>
  </template>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
